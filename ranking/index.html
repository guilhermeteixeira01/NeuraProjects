<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 15 jogadores — Neura Project</title>
<meta name="description" content="Ranking dos 15 melhores jogadores do servidor, atualizado a cada partida registrada.">
<link rel="icon" type="image/x-icon" href="/assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v=20261001d">
<link rel="stylesheet" href="/assets/css/paginas.css?v=20261001d">
<script src="/assets/js/site.js?v=20261001d"></script>
<style>
  :root { --ouro: #f5c542; --prata: #c9d1dc; --bronze: #d9894a; }

  .hero { padding: 56px 0 46px; }
  .hero-inner { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
  .resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .resumo .caixa {
    min-width: 128px; padding: 14px 18px; border-radius: 10px;
    border: 1px solid var(--border-2); background: linear-gradient(160deg, #14161b, #0d0e12);
  }
  .resumo b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.1; margin-top: 4px; }

  /* ── Métrica escolhida ── */
  .barra-topo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 26px; }
  .metricas {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 9px;
    background: var(--bg-soft); border: 1px solid var(--border);
  }
  .metricas button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--dim); background: none; border: none; cursor: pointer;
    padding: 8px 14px; border-radius: 6px; transition: background .15s, color .15s;
  }
  .metricas button:hover { color: var(--text); }
  .metricas button.active { background: rgba(26,115,232,.16); color: var(--blue-2); box-shadow: inset 0 0 0 1px rgba(26,115,232,.55); }
  .nota { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--dim-2); }

  /* ── Pódio ── */
  .podio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end; margin-bottom: 26px; }
  .pod {
    --c: var(--prata);
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    padding: 30px 20px 22px; border-radius: 16px; overflow: hidden; min-width: 0;
    border: 1px solid color-mix(in srgb, var(--c) 35%, var(--border));
    background:
      radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%),
      linear-gradient(180deg, var(--panel-2), var(--bg-soft));
    box-shadow: 0 24px 50px -30px color-mix(in srgb, var(--c) 60%, transparent);
    transition: transform .25s, border-color .25s;
  }
  .pod:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 65%, var(--border)); }
  .pod.p1 { --c: var(--ouro); order: 2; padding-top: 42px; padding-bottom: 30px; }
  .pod.p2 { --c: var(--prata); order: 1; }
  .pod.p3 { --c: var(--bronze); order: 3; }
  .pod::before {
    content: attr(data-pos); position: absolute; top: 14px; right: 18px; font-family: var(--font-display); font-weight: 700;
    font-size: 84px; line-height: .85; color: transparent; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--c) 40%, transparent);
    pointer-events: none;
  }
  .coroa { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: var(--ouro); filter: drop-shadow(0 0 10px rgba(245,197,66,.6)); }
  .pod-av { display: block; position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .p1 .pod-av { width: 132px; height: 132px; }
  .pod-av img, .pod-av .ini {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; max-width: none; padding: 4px;
    background: conic-gradient(from 210deg, var(--c), color-mix(in srgb, var(--c) 30%, #000), var(--c));
    box-shadow: 0 0 30px -6px var(--c);
  }
  .ini { display: grid; place-items: center; font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--dim); }
  .ini span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--panel-2); }
  .pod-pos {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-weight: 700; font-size: 14px; color: #0b0c0f; background: var(--c);
    padding: 2px 12px; border-radius: 999px; box-shadow: 0 4px 14px -4px var(--c);
  }
  .pod-nome:hover { color: var(--c); }
  .pod-nome { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; }
  .p1 .pod-nome { font-size: 26px; }
  .time-linha { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--dim); font-weight: 600; max-width: 100%; min-width: 0; }
  .time-linha span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time-linha img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; max-width: none; flex-shrink: 0; border: 1px solid var(--border-2); }
  /* ── CS Rating do Premier (cores das faixas do jogo) ── */
  .premier {
    --pc: #b0c3d9; position: relative; display: inline-flex; align-self: center; align-items: baseline; overflow: hidden;
    padding: 3px 12px 3px 20px; transform: skewX(-14deg); border-radius: 3px; color: var(--pc);
    background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 34%, #0b0c0f), color-mix(in srgb, var(--pc) 10%, #0b0c0f));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 55%, transparent), 0 0 18px -6px var(--pc);
    font-family: var(--font-display); font-weight: 700; line-height: 1; white-space: nowrap;
  }
  /* Faixinhas na esquerda, como no badge do jogo */
  .premier::before {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 10px;
    background: repeating-linear-gradient(90deg, var(--pc) 0 2px, transparent 2px 4px); opacity: .85;
  }
  /* Brilho passando */
  .premier::after {
    content: ""; position: absolute; inset: 0; width: 40%; left: -60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation: premier-brilho 3.2s ease-in-out infinite; animation-delay: var(--pd, 0s);
  }
  .premier b, .premier small { display: inline-block; transform: skewX(14deg); }
  .premier b { font-size: 17px; }
  .premier small { font-size: 12px; opacity: .85; }
  .pod .premier { margin-top: 2px; } .pod .premier b { font-size: 20px; } .pod .premier small { font-size: 14px; }
  .premier.sem { --pc: #5d6470; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .premier.sem::after { content: none; }
  .premier.sem small { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.2px; }
  .premier.t1 { --pc: #b0c3d9; } .premier.t2 { --pc: #8cc6ff; } .premier.t3 { --pc: #6a7dff; }
  .premier.t4 { --pc: #c166ff; } .premier.t5 { --pc: #f03cff; } .premier.t6 { --pc: #eb4b4b; } .premier.t7 { --pc: #ffd700; }
  @keyframes premier-brilho { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @keyframes premier-pop { from { opacity: 0; transform: skewX(-14deg) scale(.5); } }
  .anim .premier { animation: premier-pop .5s cubic-bezier(.34,1.56,.64,1) both; animation-delay: calc(var(--i, 0) * 45ms + .35s); }
  @media (prefers-reduced-motion: reduce) { .premier::after { content: none; } }

  .pod-valor { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 4px; }
  .pod-valor b { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; color: var(--c); text-shadow: 0 0 26px color-mix(in srgb, var(--c) 45%, transparent); }
  .p1 .pod-valor b { font-size: 54px; }
  .pod-mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border); }
  .pod-mini div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pod-mini b { font-family: var(--font-display); font-size: 17px; }
  .pod-mini span { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.2px; color: var(--dim-2); }

  /* ── Forma recente (últimos mapas) ── */
  .forma { display: inline-flex; gap: 4px; }
  .forma a {
    width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; transition: transform .15s;
  }
  .forma a:hover { transform: translateY(-2px); }
  .forma .v { color: var(--green); background: rgba(61,220,132,.12); box-shadow: inset 0 0 0 1px rgba(61,220,132,.45); }
  .forma .d { color: var(--red); background: rgba(255,70,85,.1); box-shadow: inset 0 0 0 1px rgba(255,70,85,.4); }

  /* ── Lista 4–15 ── */
  .tabela-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .linha {
    display: grid; grid-template-columns: 52px minmax(0, 1.6fr) minmax(150px, 1.2fr) 74px 64px 64px 64px 56px 124px;
    align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--border); transition: background .15s;
  }
  .linha.cab { border-top: none; background: var(--bg-soft); padding-top: 11px; padding-bottom: 11px; }
  .linha.cab span { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--dim-2); }
  .linha.cab .sel { color: var(--blue-2); }
  .linha:not(.cab):hover { background: rgba(26,115,232,.05); }
  .num-c { text-align: center; font-family: var(--font-mono); font-size: 13.5px; }
  .pos-n { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--dim-2); text-align: center; }
  .jog { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .jog .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; max-width: none; flex-shrink: 0; border: 1px solid var(--border-2); background: var(--panel-2); }
  .jog .av.ini { font-size: 14px; display: grid; place-items: center; }
  .jog-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .jog-txt .premier { align-self: flex-start; margin: 3px 0 0 4px; }
  .jog-txt a { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jog-txt a:hover { color: var(--blue-2); }
  .barra-val { display: flex; align-items: center; gap: 10px; }
  .barra-val b { font-family: var(--font-display); font-size: 18px; min-width: 52px; text-align: right; }
  .trilho { flex: 1; height: 6px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
  .trilho i { display: block; height: 100%; width: var(--w); border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--blue-2)); }
  .anim .trilho i { animation: crescer 1s cubic-bezier(.16,.84,.44,1) both; animation-delay: calc(var(--i, 0) * 50ms + .2s); }

  /* Rating (mesmas cores das páginas de partida) */
  .rt { display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; padding: 5px 7px; border-radius: 4px; }
  .rt-alto { color: #ffa31a; background: linear-gradient(180deg, rgba(255,163,26,.30), rgba(255,163,26,.10)); box-shadow: inset 0 0 0 1px rgba(255,163,26,.6); }
  .rt-bom { color: #6ee86e; background: linear-gradient(180deg, rgba(92,214,92,.28), rgba(92,214,92,.08)); box-shadow: inset 0 0 0 1px rgba(92,214,92,.55); }
  .rt-medio { color: #fff; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .rt-baixo { color: #ff5c5c; background: linear-gradient(180deg, rgba(255,77,77,.26), rgba(255,77,77,.08)); box-shadow: inset 0 0 0 1px rgba(255,77,77,.5); }

  .vazio { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 14px; border: 1px dashed var(--border-2); border-radius: 12px; }
  .esq { height: 64px; border-top: 1px solid var(--border);
    background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 40%, #1d1f26 50%, var(--panel-2) 60%, var(--panel) 100%);
    background-size: 250% 100%; animation: brilho 1.3s ease-in-out infinite; }
  .pod.esq-pod { height: 340px; border: 1px solid var(--border);
    background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 40%, #1d1f26 50%, var(--panel-2) 60%, var(--panel) 100%);
    background-size: 250% 100%; animation: brilho 1.3s ease-in-out infinite; box-shadow: none; }
  .pod.esq-pod::before { content: none; }
  .pod.esq-pod.p1 { height: 380px; }

  .anim .pod { animation: subir .6s cubic-bezier(.16,.84,.44,1) both; }
  .anim .pod.p1 { animation-delay: .05s; } .anim .pod.p2 { animation-delay: .15s; } .anim .pod.p3 { animation-delay: .25s; }
  .anim .pod-av { animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; animation-delay: .3s; }
  .anim .linha:not(.cab) { animation: subir .5s cubic-bezier(.16,.84,.44,1) both; animation-delay: calc(var(--i, 0) * 45ms + .25s); }
  @keyframes subir { from { opacity: 0; transform: translateY(16px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.5); } }
  @keyframes crescer { from { width: 0; } }
  @keyframes brilho { 0% { background-position: 100% 0; } 100% { background-position: -150% 0; } }
  @media (prefers-reduced-motion: reduce) { .anim *, .esq, .esq-pod { animation: none !important; } }

  @media (max-width: 1080px) {
    .linha { grid-template-columns: 44px minmax(0, 1.6fr) minmax(130px, 1.2fr) 70px 60px 60px 112px; }
    .c-hs, .c-mapas { display: none; }
  }
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; }
    .podio { grid-template-columns: 1fr; }
    .pod.p1, .pod.p2, .pod.p3 { order: 0; padding: 22px 18px; }
    .p1 .pod-av, .pod-av { width: 96px; height: 96px; }
    .pod-valor b, .p1 .pod-valor b { font-size: 42px; }
    .pod.esq-pod, .pod.esq-pod.p1 { height: 300px; }
  }
  @media (max-width: 720px) {
    .linha { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; }
    .linha .c-rt, .linha .c-kd, .linha .c-adr, .linha .c-kast, .linha .c-forma, .linha.cab { display: none; }
    .barra-val .trilho { display: none; }
    .barra-val b { min-width: 0; }
    .resumo { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .resumo .caixa { min-width: 0; padding: 12px; }
    .resumo b { font-size: 22px; }
    .metricas { width: 100%; }
    .metricas button { flex: 1 0 auto; padding: 8px 10px; }
    .hero h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<header data-site-nav></header>
<main>
  <section class="hero">
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="wrap hero-inner">
      <div class="reveal">
        <span class="chip"><span class="ponto"></span><span id="atualizado">CARREGANDO…</span></span>
        <h1>Top 15 <span class="destaque">jogadores</span></h1>
        <p class="lead">Ranking montado com todas as partidas registradas no servidor. Cada mapa novo entra na conta sozinho: rating, ADR, KAST, kills e forma recente.</p>
      </div>
      <div class="resumo reveal" style="--d:.1s">
        <div class="caixa"><span class="mono">JOGADORES</span><b id="r-jog">—</b></div>
        <div class="caixa"><span class="mono">MAPAS</span><b id="r-mapas">—</b></div>
        <div class="caixa"><span class="mono">KILLS</span><b id="r-kills">—</b></div>
      </div>
    </div>
  </section>

  <section class="secao" style="padding-top:40px">
    <div class="wrap">
      <div class="barra-topo">
        <div class="metricas" id="metricas" role="tablist" aria-label="Ordenar ranking por"></div>
        <span class="nota" id="nota"></span>
      </div>
      <div id="conteudo">
        <div class="podio">
          <div class="pod esq-pod p2"></div><div class="pod esq-pod p1"></div><div class="pod esq-pod p3"></div>
        </div>
        <div class="tabela-card"><div class="esq"></div><div class="esq"></div><div class="esq"></div></div>
      </div>
    </div>
  </section>
</main>
<footer data-site-footer></footer>

<script>
const TOP = 15;
const MIN_MAPAS = 1; // mapas mínimos para entrar no ranking (suba quando tiver mais partidas)

// Métricas que podem ordenar o ranking: [chave, rótulo do botão, rótulo curto, casas decimais, sufixo]
const METRICAS = [
  ["rating", "Rating", "RATING", 2, ""],
  ["kills", "Kills", "KILLS", 0, ""],
  ["adr", "ADR", "ADR", 1, ""],
  ["kast", "KAST", "KAST", 1, "%"],
  ["kd", "K/D", "K/D", 2, ""],
  ["hsPct", "HS%", "HS%", 1, "%"],
  ["winRate", "Vitórias", "VITÓRIAS", 0, "%"],
];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (v, casas) => Number(v || 0).toFixed(casas);
const classeRating = (r) => (r >= 1.5 ? "alto" : r >= 1.2 ? "bom" : r >= 0.9 ? "medio" : "baixo");
const urlOk = (u) => u && /^https?:\/\//i.test(u);
const perfil = (j) => `https://steamcommunity.com/profiles/${encodeURIComponent(j.steamId)}`;
const iniciais = (nome) => esc(String(nome || "?").trim().slice(0, 2).toUpperCase());

function avatar(j, classe) {
  const fb = `<span class="${classe} ini"><span>${iniciais(j.nome)}</span></span>`;
  return urlOk(j.avatar)
    ? `<img class="${classe}" src="${esc(j.avatar)}" alt="" loading="lazy" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(fb)}">`
    : fb;
}

// CS Rating do Premier (vem da Leetify no deploy; null = jogador sem conta na Leetify)
const faixaPremier = (v) => (v >= 30000 ? 7 : v >= 25000 ? 6 : v >= 20000 ? 5 : v >= 15000 ? 4 : v >= 10000 ? 3 : v >= 5000 ? 2 : 1);
// Igual ao jogo: milhares grandes e o resto pequeno (23,524)
const partesPremier = (v) => (v < 1000 ? [String(v), ""] : [String(Math.floor(v / 1000)), "," + String(v % 1000).padStart(3, "0")]);
const premier = (j) => {
  if (!(j.premier > 0)) return `<span class="premier sem" title="Sem CS Rating do Premier (precisa de conta na leetify.gg)"><small>SEM PREMIER</small></span>`;
  const [mil, resto] = partesPremier(j.premier);
  return `<span class="premier t${faixaPremier(j.premier)}" data-premier="${j.premier}" style="--pd:${(Math.random() * 2).toFixed(2)}s" ` +
    `title="CS Rating do Premier: ${j.premier.toLocaleString("pt-BR")}"><b>${mil}</b><small>${resto}</small></span>`;
};

// Contagem animada de 0 até o rating (mantém a cor da faixa certa enquanto sobe)
function animarPremier(raiz) {
  const els = [...raiz.querySelectorAll(".premier[data-premier]")];
  const escrever = (el, v) => {
    const [mil, resto] = partesPremier(v);
    el.firstChild.textContent = mil;
    el.lastChild.textContent = resto;
    el.className = `premier t${faixaPremier(v)}`;
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const inicio = performance.now() + 350, duracao = 1400;
  els.forEach((el) => escrever(el, 0));
  const passo = (agora) => {
    const t = Math.min(1, Math.max(0, (agora - inicio) / duracao));
    const e = 1 - Math.pow(1 - t, 3); // desacelera no fim
    els.forEach((el) => escrever(el, Math.round(Number(el.dataset.premier) * e)));
    if (t < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

const forma = (j) => `<span class="forma">${(j.ultimos || []).map((u) =>
  `<a class="${u.venceu ? "v" : "d"}" href="/partidas/${String(u.caminho).split("/").map(encodeURIComponent).join("/")}/" ` +
  `title="${esc(u.mapa)} · rating ${fmt(u.rating, 2)} · ${u.venceu ? "vitória" : "derrota"}">${u.venceu ? "V" : "D"}</a>`).join("")}</span>`;

function podio(j, pos, m) {
  const [chave, , rotulo, casas, suf] = m;
  return `<div class="pod p${pos}" data-pos="${pos}">` +
    (pos === 1 ? `<svg class="coroa" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5L3 7z"/></svg>` : "") +
    `<a class="pod-av" href="${perfil(j)}" target="_blank" rel="noopener">${avatar(j, "")}<span class="pod-pos">#${pos}</span></a>` +
    `<a class="pod-nome" href="${perfil(j)}" target="_blank" rel="noopener">${esc(j.nome)}</a>${premier(j)}` +
    `<span class="pod-valor"><b>${fmt(j[chave], casas)}${suf}</b><span class="mono">${rotulo}</span></span>` +
    `<div class="pod-mini">` +
      `<div><b>${chave === "rating" ? fmt(j.kd, 2) : fmt(j.rating, 2)}</b><span>${chave === "rating" ? "K/D" : "RATING"}</span></div>` +
      `<div><b>${fmt(j.adr, 1)}</b><span>ADR</span></div>` +
      `<div><b>${j.kills}</b><span>KILLS</span></div>` +
      `<div><b>${j.mapas}</b><span>MAPAS</span></div>` +
    `</div>${forma(j)}</div>`;
}

function linha(j, pos, m, max, i) {
  const [chave, , , casas, suf] = m;
  const w = max > 0 ? Math.max(3, (j[chave] / max) * 100) : 0;
  return `<div class="linha" style="--i:${i}">` +
    `<span class="pos-n">${pos}</span>` +
    `<span class="jog">${avatar(j, "av")}<span class="jog-txt"><a href="${perfil(j)}" target="_blank" rel="noopener">${esc(j.nome)}</a>${premier(j)}</span></span>` +
    `<span class="barra-val"><b>${fmt(j[chave], casas)}${suf}</b><span class="trilho"><i style="--w:${w.toFixed(1)}%"></i></span></span>` +
    (chave === "rating"
      ? `<span class="num-c c-rt">${j.kills}</span>`
      : `<span class="num-c c-rt"><span class="rt rt-${classeRating(j.rating)}" title="Rating médio">${fmt(j.rating, 2)}</span></span>`) +
    `<span class="num-c c-kd">${fmt(j.kd, 2)}</span>` +
    `<span class="num-c c-adr">${fmt(j.adr, 1)}</span>` +
    `<span class="num-c c-kast">${fmt(j.kast, 0)}%</span>` +
    `<span class="num-c c-hs">${fmt(j.hsPct, 0)}%</span>` +
    `<span class="c-forma">${forma(j)}</span>` +
    `</div>`;
}

function render(dados, chave) {
  const m = METRICAS.find((x) => x[0] === chave) || METRICAS[0];
  const top = dados.jogadores
    .filter((j) => j.mapas >= MIN_MAPAS)
    .sort((a, b) => b[m[0]] - a[m[0]] || b.rating - a.rating || b.kills - a.kills)
    .slice(0, TOP);

  const el = document.getElementById("conteudo");
  if (top.length === 0) {
    el.innerHTML = `<p class="vazio">Ainda não há jogadores no ranking. Assim que uma partida terminar no servidor, ela entra aqui.</p>`;
    return;
  }

  const [p1, p2, p3] = top;
  const resto = top.slice(3);
  const max = resto.length ? Math.max(...top.map((j) => j[m[0]])) : 0;
  el.innerHTML =
    `<div class="podio">${[p1, p2, p3].map((j, i) => (j ? podio(j, i + 1, m) : "")).join("")}</div>` +
    (resto.length
      ? `<div class="tabela-card"><div class="linha cab"><span class="num-c">#</span><span>JOGADOR</span><span class="sel">${m[2]}</span>` +
        `<span class="num-c c-rt">${m[0] === "rating" ? "KILLS" : "RATING"}</span><span class="num-c c-kd">K/D</span><span class="num-c c-adr">ADR</span>` +
        `<span class="num-c c-kast">KAST</span><span class="num-c c-hs">HS%</span><span class="c-forma">FORMA</span></div>` +
        resto.map((j, i) => linha(j, i + 4, m, max, i)).join("") + `</div>`
      : "");

  el.classList.remove("anim");
  void el.offsetWidth; // reinicia a animação ao trocar de métrica
  el.classList.add("anim");
  animarPremier(el);
}

function dataBr(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(",", "");
}

fetch("ranking.json", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .catch(() => null)
  .then((dados) => {
    dados = dados && Array.isArray(dados.jogadores) ? dados : { jogadores: [], partidas: 0 };
    const quando = dataBr(dados.atualizado);
    document.getElementById("atualizado").textContent = quando ? `ATUALIZADO ${quando}` : "SEM DADOS AINDA";
    document.getElementById("r-jog").textContent = dados.jogadores.length;
    document.getElementById("r-mapas").textContent = dados.partidas || 0;
    document.getElementById("r-kills").textContent = dados.jogadores.reduce((s, j) => s + (j.kills || 0), 0);
    document.getElementById("nota").textContent = `MÍNIMO DE ${MIN_MAPAS} MAPA${MIN_MAPAS === 1 ? "" : "S"} · RATING HLTV 1.0`;

    const caixa = document.getElementById("metricas");
    caixa.innerHTML = METRICAS.map((m) => `<button type="button" role="tab" data-m="${m[0]}">${m[1]}</button>`).join("");
    const botoes = caixa.querySelectorAll("button");
    const escolher = (chave) => {
      botoes.forEach((b) => {
        b.classList.toggle("active", b.dataset.m === chave);
        b.setAttribute("aria-selected", String(b.dataset.m === chave));
      });
      render(dados, chave);
    };
    botoes.forEach((b) => b.addEventListener("click", () => {
      history.replaceState(null, "", b.dataset.m === "rating" ? location.pathname : `#${b.dataset.m}`);
      escolher(b.dataset.m);
    }));
    const inicial = (location.hash || "").slice(1);
    escolher(METRICAS.some((m) => m[0] === inicial) ? inicial : "rating");
  });
</script>
</body>
