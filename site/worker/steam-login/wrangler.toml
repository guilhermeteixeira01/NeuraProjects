# Login pela Steam do site (Cloudflare Worker). Publicar: npx wrangler deploy (nesta pasta)
name = "neura-steam-login"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SITE = "https://neuraproject.com.br"
# Dono do site (Te1xe1ra): sempre admin e o único que promove outros admins no painel
DONO = "76561199151150360"
# Servidor de CS2 das partidas do lobby (aparece no botão Entrar na partida). A senha é o segredo SERVIDOR_SENHA
# Depósito de NP (Asaas). Sandbox (testes) até a conta de produção estar pronta; produção: "https://api.asaas.com/v3".
# Segredos: npx wrangler secret put ASAAS_API_KEY  e  npx wrangler secret put ASAAS_WEBHOOK_TOKEN
ASAAS_URL = "https://api.asaas.com/v3"
SERVIDOR_CONECTAR = "179.197.67.29:27015"
# Confirmação de e-mail / recuperação de senha por e-mail (Resend). Domínio neuraproject.com.br verificado em 25/10.
# Segredo: npx wrangler secret put RESEND_API_KEY
EMAIL_PRONTO = "1"
# Para testar no `npm run dev`, descomente:
# ORIGENS_EXTRAS = "http://localhost:5173"

# Segredos (não ficam neste arquivo):
#   npx wrangler secret put SEGREDO        -> texto aleatório longo (obrigatório)
#   npx wrangler secret put STEAM_API_KEY  -> chave de https://steamcommunity.com/dev/apikey (opcional)

# Molduras de avatar escolhidas pelos jogadores (personalização do perfil): uma chave "molduras" com
# { "<SteamID64>": "<coleção>/<moldura>" }
[[kv_namespaces]]
binding = "MOLDURAS"
id = "2a74b48573a24744b6b5771ef4ae8ba4"

# Confere os cargos automáticos (top N do ranking) a cada 10 minutos: quem saiu do top perde o cargo e a moldura
# exclusiva dele sai do perfil (scheduled() em src/index.js). Na primeira rodada de cada hora também atualiza o
# Premier (Leetify) dos jogadores do ranking (KV "premier", rota GET /premier)
[triggers]
crons = ["*/10 * * * *"]

# Amigos: presença em tempo real (online / ausente / offline). Um Durable Object só ("global") guarda os WebSockets
# abertos pelo site (src/amigos.js). SQLite: é o tipo que funciona no plano grátis.
[[durable_objects.bindings]]
name = "PRESENCA"
class_name = "Presenca"

# Loja de caixas: um objeto por jogador (src/loja.js): saldo gasto, histórico de aberturas e transação de compra/abertura
[[durable_objects.bindings]]
name = "LOJA"
class_name = "Loja"

# Trocas entre jogadores: um objeto global (src/trocas.js) que roda um pedido de cada vez
[[durable_objects.bindings]]
name = "TROCAS"
class_name = "Trocas"

# Mercado entre jogadores: um objeto global (src/mercado.js) com os anúncios; compra um de cada vez
[[durable_objects.bindings]]
name = "MERCADO"
class_name = "Mercado"

# Registro (log) do painel de admin: um objeto global com as entradas em SQLite (src/registro.js)
[[durable_objects.bindings]]
name = "REGISTRO"
class_name = "Registro"

# Times de jogadores (src/equipes.js): criar com NP, cargos, convites e chat do time
[[durable_objects.bindings]]
name = "EQUIPES"
class_name = "Equipes"

# Contas: apelido único e senha de segurança (src/contas.js)
[[durable_objects.bindings]]
name = "CONTAS"
class_name = "Contas"

# Dados compartilhados (perfis, usuarios, config, bônus, caixas...): um objeto global com uma linha por registro e versão (src/dados.js)
[[durable_objects.bindings]]
name = "DADOS"
class_name = "Dados"

# Retratos do Hall: fila persistente e imagens geradas, um objeto por jogador.
[[durable_objects.bindings]]
name = "HALL_RETRATOS"
class_name = "HallRetratos"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presenca"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Loja"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Trocas"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Mercado"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Registro"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Equipes"]

# Contas: apelido único e senha de segurança dos jogadores (src/contas.js)
[[migrations]]
tag = "v7"
new_sqlite_classes = ["Contas"]

# Dados: perfis, usuarios e docs saem do KV (lidos de lá uma vez, na primeira leitura de cada um)
[[migrations]]
tag = "v8"
new_sqlite_classes = ["Dados"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["HallRetratos"]

# Workers AI no plano Free; limite adicional de 10 tentativas/dia em hall-cota.js.
[ai]
binding = "AI"
