<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>/* Configurações ⚙ antes de desenhar (sem piscar): tema, "melhorar desempenho" e idioma */try{var d=document.documentElement,s=localStorage,t=s.getItem("np_tema"),l=s.getItem("np_idioma");if(t==="claro"||t==="escuro"||t==="branco")d.setAttribute("data-tema",t);if(s.getItem("np_desempenho")==="1")d.setAttribute("data-desempenho","1");if(l==="en"||l==="es"){d.lang=l}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>/* fundo do tema já no primeiro quadro (sem piscar branco ao trocar de página) */html{background:#0b0c0f}html[data-tema=escuro]{background:#101114}html[data-tema=claro],html[data-tema=branco]{background:#f2f4f8}</style>
<title>Página não encontrada — Neura Project</title>
<meta name="description" content="Essa página não existe no site da Neura Project.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/logos/android-chrome-192x192.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logos/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#050914">
<link rel="preload" as="image" href="/assets/404-foto.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
:root{
  --bg:#050914;
  --texto:#ffffff;
  --ciano:#38bdf8;   --azul:#3b82f6;   --violeta:#a855f7;   --magenta:#ff3df2;   --ambar:#ffb84d;
  /* A arte do 404 (com o número e o texto desenhados nela): public/assets/404-foto.webp */
  --foto:url("/assets/404-foto.webp");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--texto);overflow:hidden;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.cena{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* ---------- arte ---------- */
.figura{
  /* arte fixa, do tamanho da tela (sem zoom nem movimento) */
  position:absolute;inset:0;
  background:var(--foto) center/cover no-repeat;
}
/* quando a página "falha" por um instante (glitch ocasional) */
.figura.glitch{animation:glitch .22s steps(2,end) 1}
@keyframes glitch{
  0%{filter:none;clip-path:inset(0 0 0 0)}
  20%{filter:hue-rotate(40deg) saturate(1.6);clip-path:inset(12% 0 70% 0);translate:-8px 0}
  40%{filter:hue-rotate(-30deg);clip-path:inset(58% 0 22% 0);translate:9px 0}
  60%{filter:saturate(1.8) contrast(1.15);clip-path:inset(30% 0 48% 0);translate:-5px 0}
  100%{filter:none;clip-path:inset(0 0 0 0);translate:0 0}
}
canvas#particulas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* leve escurecida só nas bordas de baixo, para o botão ler bem (a arte fica como está) */
.base{position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;background:linear-gradient(0deg,rgba(3,6,14,.55),transparent)}

/* ---------- botão ---------- */
.conteudo{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(26px,8vh,86px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:14px;width:max-content;max-width:92vw}
.botao{
  position:relative;display:inline-flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:var(--texto);
  padding:clamp(13px,1.8vh,17px) clamp(30px,3.6vw,56px);
  font:700 clamp(12px,1.15vw,15px) "Chakra Petch",sans-serif;letter-spacing:.2em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(15,30,70,.55),rgba(6,12,34,.72));backdrop-filter:blur(4px);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.6);
  transition:color .3s,box-shadow .3s,letter-spacing .3s;-webkit-tap-highlight-color:transparent;
}
.botao::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ciano),var(--azul) 55%,var(--violeta));opacity:0;transition:opacity .3s}
.botao span,.botao svg{position:relative;z-index:1}
.botao svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.botao::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:brilho 4.2s ease-in-out infinite}
@keyframes brilho{0%,55%{left:-45%}85%,100%{left:130%}}
@media (hover:hover){
  .botao:hover{color:#04101f;letter-spacing:.24em;box-shadow:0 0 0 1px rgba(56,189,248,.9),0 0 38px rgba(59,130,246,.65)}
  .botao:hover::before{opacity:1}
  .botao:hover svg{transform:translateX(-4px)}
}
.botao:active::before{opacity:1}
.botao:active{color:#04101f}
.dica{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(190,215,255,.7);text-shadow:0 0 10px rgba(56,189,248,.6)}
.dica i{display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--ciano);box-shadow:0 0 10px var(--ciano);animation:pisca 1.4s ease-in-out infinite}
@keyframes pisca{50%{opacity:.25}}

/* celular em pé: a arte inteira (404 visível) no alto, com ela mesma desfocada preenchendo o resto da tela */
.cena::before{content:"";display:none;position:absolute;inset:-20px;background:var(--foto) center/cover no-repeat;filter:blur(22px) brightness(.55)}
@media (max-width:760px) and (orientation:portrait){
  .cena::before{display:block}
  .figura{inset:max(8vh,env(safe-area-inset-top,0px)) 0 auto 0;height:62%;background-size:contain;background-position:center top}
}
@media (max-width:760px){
  .conteudo{bottom:calc(9vh + env(safe-area-inset-bottom,0px))}
  .botao{padding:13px 28px;font-size:12px;letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-desempenho="1"] canvas#particulas{display:none}
</style>
</head>
<body>
<main class="cena">
  <div class="figura" role="img" aria-label="404 — Página não encontrada"></div>
  <canvas id="particulas" aria-hidden="true"></canvas>
  <div class="base"></div>

  <section class="conteudo">
    <a class="botao" href="/" aria-label="Voltar ao início">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span data-i18n>Voltar ao início</span>
    </a>
    <span class="dica"><i></i><span class="dica-txt">Erro 404 · sinal perdido</span></span>
  </section>
</main>

<script>
/* Partida recém-jogada que o deploy ainda não publicou: o GitHub Pages cai aqui (404). Busca os dados no worker (que recebe a partida do
   plugin na hora) e troca esta página pela página da partida, mantendo o endereço. Sem dados no worker, segue o 404 normal. */
(function(){
  var m=location.pathname.match(/^\/partidas\/(.+?)\/?$/);if(!m)return;
  var c;try{c=decodeURIComponent(m[1])}catch(e){return}
  var W='https://neura-steam-login.steam-login.workers.dev',h=document.documentElement;
  h.style.visibility='hidden'; /* sem piscar o 404 enquanto confere */
  var volta=function(){h.style.visibility=''};
  Promise.all([
    fetch(W+'/partidas/dados?c='+encodeURIComponent(c)).then(function(r){return r.ok?r.json():null}),
    fetch('/partidas/partida.html').then(function(r){return r.ok?r.text():null})
  ]).then(function(v){
    var d=v[0],modelo=v[1];if(!d||!modelo)return volta();
    d.caminho=d.caminho||c;d.xp=d.xp||{};
    var dados='<script id="dados-pagina" type="application/json">'+JSON.stringify(d).replace(/</g,'\\u003c')+'<\/script>';
    var pag=modelo.replace('<!--app-->','').replace('<!--dados-->',function(){return dados});
    document.open();document.write(pag);document.close();
  }).catch(volta);
})();

/* Botão voltar: garante a navegação para a página inicial */
(function(){var b=document.querySelector('.botao');if(!b)return;b.addEventListener('click',function(e){e.preventDefault();location.assign('/')})})();

/* Textos EN/ES (usa o idioma salvo em np_idioma) */
(function(){
  var L=document.documentElement.lang,T={
    en:{t:"Page not found — Neura Project",b:"Back home",d:"Error 404 · signal lost",a:"404 — Page not found"},
    es:{t:"Página no encontrada — Neura Project",b:"Volver al inicio",d:"Error 404 · señal perdida",a:"404 — Página no encontrada"}}[L];
  if(!T)return;document.title=T.t;
  document.querySelector('.botao span').textContent=T.b;
  document.querySelector('.botao').setAttribute('aria-label',T.b);
  document.querySelector('.dica-txt').textContent=T.d;
  document.querySelector('.figura').setAttribute('aria-label',T.a);
})();

/* Partículas cyberpunk: chuva fina, poeira de luz (âmbar das janelas) e faíscas neon (ciano, azul, violeta e magenta), tudo com brilho aditivo. */
(function(){
  var c=document.getElementById('particulas');if(!c||getComputedStyle(c).display==='none')return;
  var x=c.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2),
      leve=matchMedia('(pointer:coarse)').matches||innerWidth<760,
      NEON=['56,189,248','59,130,246','168,85,247','255,61,242'],AMBAR='255,184,77';
  var rand=function(a,b){return a+Math.random()*(b-a)};
  function size(){W=c.width=Math.round(innerWidth*dpr);H=c.height=Math.round(innerHeight*dpr)}
  addEventListener('resize',size);size();

  /* chuva */
  var chuva=[],NC=leve?55:120;
  function gota(topo){var v=rand(16,30)*dpr;return{x:rand(-.1,1.1)*W,y:topo?-rand(0,.3)*H:rand(0,H),v:v,l:rand(12,30)*dpr*(v/(22*dpr)),a:rand(.1,.32),w:rand(.6,1.2)*dpr}}
  for(var i=0;i<NC;i++)chuva.push(gota(false));

  /* poeira de luz */
  var poeira=[],NP=leve?40:90;
  function mota(){var amb=Math.random()<.45;return{x:rand(0,W),y:rand(0,H),r:rand(.7,2.3)*dpr,vy:-rand(.1,.45)*dpr,vx:rand(-.15,.15)*dpr,fase:rand(0,6.28),vf:rand(.012,.035),cor:amb?AMBAR:NEON[Math.floor(Math.random()*2)]}}
  for(i=0;i<NP;i++)poeira.push(mota());

  /* faíscas neon com rastro curto */
  var faiscas=[],NF=leve?10:24;
  function faisca(){var cor=NEON[Math.floor(Math.random()*NEON.length)];return{x:rand(0,W),y:H+rand(0,.2)*H,vx:rand(-.5,.9)*dpr,vy:-rand(.9,2.6)*dpr,r:rand(1.3,3)*dpr,vida:rand(.5,1),cor:cor,rastro:[],osc:rand(0,6.28),vo:rand(.02,.06)}}
  for(i=0;i<NF;i++){var f=faisca();f.y=rand(0,H);faiscas.push(f)}

  var vento=0;
  function quadro(){
    x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    /* chuva */
    x.lineCap='round';
    for(var i=0;i<chuva.length;i++){var g=chuva[i];
      g.y+=g.v;g.x-=g.v*.12;
      if(g.y>H+g.l||g.x<-40){chuva[i]=gota(true);g=chuva[i]}
      x.strokeStyle='rgba(150,200,255,'+g.a+')';x.lineWidth=g.w;
      x.beginPath();x.moveTo(g.x,g.y);x.lineTo(g.x+g.l*.12,g.y-g.l);x.stroke()}
    /* poeira */
    for(i=0;i<poeira.length;i++){var m=poeira[i];
      m.fase+=m.vf;m.y+=m.vy;m.x+=m.vx+Math.sin(m.fase)*.25*dpr;
      if(m.y<-10||m.x<-10||m.x>W+10){poeira[i]=mota();poeira[i].y=H+5;m=poeira[i]}
      var a=.25+.55*Math.abs(Math.sin(m.fase*1.3));
      var gr=x.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*4);
      gr.addColorStop(0,'rgba('+m.cor+','+a+')');gr.addColorStop(1,'rgba('+m.cor+',0)');
      x.fillStyle=gr;x.beginPath();x.arc(m.x,m.y,m.r*4,0,6.283);x.fill()}
    /* faíscas */
    for(i=0;i<faiscas.length;i++){var s=faiscas[i];
      s.osc+=s.vo;s.x+=s.vx+Math.sin(s.osc)*.9*dpr;s.y+=s.vy;s.vida-=.0022;
      s.rastro.push(s.x,s.y);if(s.rastro.length>16)s.rastro.splice(0,2);
      if(s.y<-20||s.vida<=0){faiscas[i]=faisca();continue}
      var al=Math.min(1,s.vida*1.6);
      for(var k=0;k<s.rastro.length;k+=2){var t=k/s.rastro.length;
        x.fillStyle='rgba('+s.cor+','+(al*t*.35)+')';x.beginPath();x.arc(s.rastro[k],s.rastro[k+1],s.r*t,0,6.283);x.fill()}
      var gs=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);
      gs.addColorStop(0,'rgba(255,255,255,'+al+')');gs.addColorStop(.25,'rgba('+s.cor+','+al*.85+')');gs.addColorStop(1,'rgba('+s.cor+',0)');
      x.fillStyle=gs;x.beginPath();x.arc(s.x,s.y,s.r*6,0,6.283);x.fill()}
    x.globalCompositeOperation='source-over';
    requestAnimationFrame(quadro)}
  quadro();

  /* parallax leve com o mouse e glitch ocasional (só no computador) */
  var fig=document.querySelector('.figura');
  if(!leve){
    (function glitch(){setTimeout(function(){fig.classList.add('glitch');setTimeout(function(){fig.classList.remove('glitch')},260);glitch()},rand(6000,13000))})()}
})();
</script>
</body>
</html>
