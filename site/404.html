<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>/* Configurações ⚙ antes de desenhar (sem piscar): tema, "melhorar desempenho" e idioma */try{var d=document.documentElement,s=localStorage,t=s.getItem("np_tema"),l=s.getItem("np_idioma");if(t==="claro"||t==="escuro"||t==="branco")d.setAttribute("data-tema",t);if(s.getItem("np_desempenho")==="1")d.setAttribute("data-desempenho","1");if(l==="en"||l==="es"){d.lang=l}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página não encontrada — Neura Project</title>
<meta name="description" content="Essa página não existe no site da Neura Project.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/logos/android-chrome-192x192.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logos/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"></noscript>
<style>
:root{
  /* ===== PALETA — ajuste aqui para casar com o resto do site ===== */
  --bg:#0b0c0f;
  --texto:#ffffff;
  --texto-suave:rgba(255,255,255,.55);
  --linha:rgba(255,255,255,.28);
  --verde:#22d37a;   --verde-2:#07803f;   /* pétalas verdes */
  --azul:#2f7bff;    --azul-2:#0f3fa8;    /* pétalas azuis  */
  /* ===== FOTO — coloque uma imagem livre (Unsplash/Pexels) aqui ===== */
  --foto:url("/assets/404-foto.jpg");
}
:root[data-tema="claro"]{--bg:#e9e9ec;--texto:#0b0c0f;--texto-suave:rgba(11,12,15,.6);--linha:rgba(11,12,15,.3)}
:root[data-tema="branco"]{--bg:#fff;--texto:#0b0c0f;--texto-suave:rgba(11,12,15,.6);--linha:rgba(11,12,15,.3)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--texto);overflow:hidden;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.cena{position:fixed;inset:0;overflow:hidden}

/* ---------- figura / foto ---------- */
.figura{
  position:absolute;inset:0;
  background:var(--foto) 30% center/cover no-repeat;
  filter:grayscale(.3) contrast(1.06) brightness(.85);
  transform-origin:30% 50%;
  animation:respira 14s ease-in-out infinite alternate;
}
/* tinta azul/verde sobre a figura (esconde pixelação e liga ao tema) */
.tinta{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;
  background:linear-gradient(135deg,rgba(47,123,255,.7),rgba(34,211,122,.5))}
/* grão de filme */
.grao{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vinheta{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0,transparent 20%),
   linear-gradient(0deg,color-mix(in srgb,var(--bg) 85%,transparent) 0,transparent 22%),
   linear-gradient(90deg,transparent 0,transparent 30%,color-mix(in srgb,var(--bg) 72%,transparent) 62%,color-mix(in srgb,var(--bg) 90%,transparent) 100%)}
@keyframes respira{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.08) translate(-.6vw,-.8vh)}}

canvas#petalas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- topo ---------- */
.topo{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;padding-top:calc(clamp(12px,2.4vh,26px) + env(safe-area-inset-top,0px));z-index:5}
.logo{text-align:center;text-decoration:none;color:var(--texto)}
.logo b{display:block;font:700 clamp(20px,2.6vw,30px)/1 "Chakra Petch",sans-serif;letter-spacing:.14em}
.logo small{display:block;margin-top:5px;font-size:7px;letter-spacing:.38em;color:var(--texto-suave)}
.acoes-topo{position:absolute;right:clamp(14px,2vw,28px);top:clamp(14px,2.6vh,28px);display:flex;gap:18px}

.ico{width:18px;height:18px;stroke:var(--texto);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;transition:transform .25s,opacity .25s;opacity:.9}
a:hover .ico,button:hover .ico{transform:translateY(-2px);opacity:1}
.ico.cheio{fill:var(--texto);stroke:none}

/* ---------- linhas laterais ---------- */
.lateral{position:absolute;top:50%;display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.2em;color:var(--texto-suave);z-index:4}
.lateral i{display:block;width:clamp(40px,6vw,86px);height:1px;background:var(--linha)}
.lateral.e{left:0}.lateral.d{right:0;flex-direction:row-reverse}

/* ---------- conteúdo ---------- */
.conteudo{position:absolute;right:clamp(28px,8vw,150px);bottom:clamp(60px,15vh,150px);z-index:6;display:flex;flex-direction:column;align-items:center}
.botao{
  position:relative;z-index:20;cursor:pointer;pointer-events:auto;display:inline-block;margin-bottom:clamp(-30px,-3vh,-8px);margin-top:0;
  padding:clamp(12px,1.6vh,16px) clamp(28px,3.4vw,52px);
  border:1px solid var(--texto);color:var(--texto);text-decoration:none;
  font:600 clamp(11px,1.15vw,15px) "Chakra Petch",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(0,0,0,.25);backdrop-filter:blur(2px);overflow:hidden;
  transition:color .35s;-webkit-tap-highlight-color:transparent;
  transform:translateY(-6vh);
}
.botao::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--verde),var(--azul));transform:translateX(-101%);transition:transform .4s cubic-bezier(.7,0,.2,1);z-index:-1}
@media (hover:hover){.botao:hover{color:#05060a;border-color:transparent}.botao:hover::before{transform:none}}
.botao:active{color:#05060a;border-color:transparent}.botao:active::before{transform:none}

.numero{position:relative;z-index:1;pointer-events:none;display:flex;align-items:flex-end}
.numero h1{
  font:700 min(clamp(130px,27vw,400px),50vh)/.82 "Chakra Petch",sans-serif;letter-spacing:-.02em;color:var(--texto);
  text-shadow:0 0 70px rgba(47,123,255,.28),0 0 140px rgba(34,211,122,.16);
  animation:entra 1.1s cubic-bezier(.2,.8,.2,1) both;
}
.numero h1 span:nth-child(2){display:inline-block;animation:vira 1.4s .2s cubic-bezier(.2,.8,.2,1) both}
.vertical{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font:500 clamp(8px,.9vw,12px) "JetBrains Mono",monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--texto);
  margin-left:clamp(6px,1vw,14px);padding-bottom:.4em;align-self:flex-start;margin-top:.6em;
}
@keyframes entra{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes vira{from{transform:rotateY(90deg)}to{transform:none}}

/* ---------- rodapé ---------- */
.rodape{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2.4vh,24px) clamp(14px,2vw,28px) calc(clamp(12px,2.4vh,24px) + env(safe-area-inset-bottom,0px));z-index:6}
.grupo{display:flex;gap:18px;align-items:center}
.pontos{display:flex;gap:5px}
.pontos i{width:4px;height:4px;border-radius:50%;background:var(--texto-suave)}
.pontos i:nth-child(2){background:var(--verde)}

/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .conteudo{right:clamp(20px,5vw,80px)}
}
@media (max-width:760px){
  .figura{background-position:24% center}
  .vinheta{background:
    linear-gradient(180deg,color-mix(in srgb,var(--bg) 65%,transparent) 0,transparent 20%),
    linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--bg) 60%,transparent) 55%,color-mix(in srgb,var(--bg) 94%,transparent) 100%)}
  .conteudo{right:auto;left:50%;transform:translateX(-50%);bottom:calc(9vh + env(safe-area-inset-bottom,0px))}
  .botao{transform:none;margin:0 0 16px;padding:13px 30px;font-size:12px}
  .numero h1{font:700 min(clamp(110px,42vw,230px),36vh)/.82 "Chakra Petch",sans-serif}
  .vertical{font-size:8px;letter-spacing:.26em;margin-left:8px}
  .lateral{display:none}
  .logo b{font-size:20px}
  .logo small{font-size:6px}
}
@media (max-height:520px) and (orientation:landscape){
  .conteudo{bottom:7vh;right:5vw;left:auto;transform:none}
  .botao{transform:none;margin:0 0 10px;padding:9px 24px;font-size:11px}
  .numero h1{font-size:min(30vw,52vh)}
  .logo small,.lateral{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-desempenho="1"] .figura{animation:none}
:root[data-desempenho="1"] canvas#petalas{display:none}
</style>
</head>
<body>
<main class="cena">
  <!-- Figura: arquivo /assets/404-foto.jpg (veja --foto no CSS) -->
  <div class="figura" role="img" aria-label=""></div>
  <div class="tinta"></div>
  <div class="vinheta"></div>
  <div class="grao"></div>
  <canvas id="petalas"></canvas>

  <header class="topo">
    <a class="logo" href="/" aria-label="Neura Project"><b>NEURA</b><small>PROJECT · 404 · ERROR</small></a>
  </header>

  <div class="lateral e"><i></i><span>ERR</span></div>
  <div class="lateral d"><i></i><span>404</span></div>

  <section class="conteudo">
    <a class="botao" href="/" data-i18n>Voltar ao início</a>
    <div class="numero">
      <h1 aria-label="404"><span>4</span><span>0</span><span>4</span></h1>
      <span class="vertical">Página não encontrada</span>
    </div>
  </section>

  <footer class="rodape">
    <div class="pontos"><i></i><i></i><i></i></div>
  </footer>
</main>

<script>
/* Botão voltar: garante a navegação para a página inicial */
(function(){var b=document.querySelector('.botao');if(!b)return;b.addEventListener('click',function(e){e.preventDefault();location.assign('/')})})();

/* Textos EN/ES (usa o idioma salvo em np_idioma) */
(function(){
  var L=document.documentElement.lang,T={
    en:{t:"Page not found — Neura Project",b:"Back home",v:"Page not found"},
    es:{t:"Página no encontrada — Neura Project",b:"Volver al inicio",v:"Página no encontrada"}}[L];
  if(!T)return;document.title=T.t;
  document.querySelector('.botao').textContent=T.b;
  document.querySelector('.vertical').textContent=T.v;
})();

/* Pétalas caindo */
(function(){
  var c=document.getElementById('petalas');if(!c||getComputedStyle(c).display==='none')return;
  var x=c.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,2),P=[],
  cs=getComputedStyle(document.documentElement),
  V=[cs.getPropertyValue('--verde').trim()||'#22d37a',cs.getPropertyValue('--verde-2').trim()||'#07803f'],Z=[cs.getPropertyValue('--azul').trim()||'#2f7bff',cs.getPropertyValue('--azul-2').trim()||'#0f3fa8'];
  function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}
  addEventListener('resize',size);size();
  function nova(topo){
    var k=Math.max(.5,Math.min(1,innerWidth/1300)),r0=Math.random(),gig=r0<.07,grande=!gig&&r0<.25,s=(gig?90+Math.random()*50:grande?38+Math.random()*14:14+Math.random()*12)*dpr*k;
    return{x:Math.random()*W,y:topo?-s*2:Math.random()*H,s:s,
      vy:(gig?2.4:grande?1.7:.8+Math.random()*1.1)*dpr,vx:(Math.random()-.4)*.5*dpr,
      r:Math.random()*6.28,vr:(Math.random()-.5)*.04,
      sw:Math.random()*6.28,swv:.01+Math.random()*.02,
      a:gig?.32:grande?.6:.92,blur:grande||gig,bl:gig?9:4,cor:Math.random()<.5?V:Z}}
  var N=innerWidth<760?16:30;for(var i=0;i<N;i++)P.push(nova(false));
  function petala(p){
    var s=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.r);
    x.scale(1,.55+.45*Math.abs(Math.sin(p.sw)));x.globalAlpha=p.a;
    if(p.blur)x.filter='blur('+(p.bl||4)*dpr+'px)';
    var g=x.createRadialGradient(0,-s*.2,s*.1,0,0,s);g.addColorStop(0,p.cor[0]);g.addColorStop(1,p.cor[1]);
    x.fillStyle=g;x.beginPath();x.moveTo(0,-s);
    x.bezierCurveTo(s*.9,-s*.6,s*.8,s*.7,0,s);
    x.bezierCurveTo(-s*.8,s*.7,-s*.9,-s*.6,0,-s);x.fill();x.restore()}
  function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(function(p,i){
      p.y+=p.vy;p.sw+=p.swv;p.x+=p.vx+Math.sin(p.sw)*.8*dpr;p.r+=p.vr;
      if(p.y>H+p.s*2||p.x<-100||p.x>W+100)P[i]=nova(true);petala(p)});
    requestAnimationFrame(loop)}
  loop();
})();
</script>
</body>
</html>
