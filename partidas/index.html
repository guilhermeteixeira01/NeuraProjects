<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partidas — NEURA PROJECT</title>
<link rel="icon" href="https://neuraproject.com.br/neurapick/logos/logoNP.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>:root{--bg:#0b0c0f;--bg-soft:#0e0f13;--panel:#121317;--panel-2:#16171c;--border:#232427;--border-2:#2e2f36;
--text:#f1f1f1;--dim:#9a9ba3;--dim-2:#6d6e77;--blue:#1a73e8;--blue-2:#3498db;--green:#3ddc84;--green-2:#2fbf6f;
--orange:#ff7a1a;--red:#ff4655;--yellow:#f5c542;--team-a:var(--blue-2);--team-b:var(--orange);--ct:#5aa9ff;--t:#e8b04a;
--font-display:'Chakra Petch','Segoe UI',sans-serif;--font-body:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
--font-mono:'JetBrains Mono','Consolas',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:repeating-linear-gradient(0deg,transparent,transparent 42px,rgba(255,255,255,.012) 42px,rgba(255,255,255,.012) 43px),
repeating-linear-gradient(90deg,transparent,transparent 42px,rgba(255,255,255,.012) 42px,rgba(255,255,255,.012) 43px),var(--bg);
color:var(--text);font-family:var(--font-body);line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.mono-label{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:var(--dim-2);text-transform:uppercase}
.t-A{color:var(--team-a)}.t-B{color:var(--team-b)}
.hud-frame{position:relative;padding:14px}
.hud-frame::before,.hud-frame::after{content:'';position:absolute;width:26px;height:26px;border:2px solid var(--blue);opacity:.85;pointer-events:none}
.hud-frame::before{top:0;left:0;border-right:none;border-bottom:none}
.hud-frame::after{bottom:0;right:0;border-left:none;border-top:none}
.nav{position:sticky;top:0;z-index:200;background:rgba(11,12,15,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1180px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;line-height:1.2}
.nav-brand .outline{-webkit-text-stroke:1px var(--blue-2);color:transparent}
.nav-brand .mark{width:30px;height:30px;max-width:none;flex-shrink:0;object-fit:contain}
.nav-brand .sub{display:block;font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:2px;color:var(--dim-2);margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;padding:10px 20px;border-radius:8px;
border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-ghost{border-color:var(--border-2);color:var(--text)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue-2)}
.btn-sm{padding:8px 14px;font-size:12px}
.hero{position:relative;overflow:hidden;padding:48px 0;border-bottom:1px solid var(--border)}
.hero-glow{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.hero-glow-1{width:460px;height:460px;top:-140px;left:-120px;background:var(--blue);opacity:.22}
.hero-glow-2{width:420px;height:420px;bottom:-160px;right:-110px;background:var(--orange);opacity:.1}
.hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:22px}
.hero-status{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;color:var(--green);
border:1px solid rgba(61,220,132,.3);background:rgba(61,220,132,.08);padding:5px 10px;border-radius:5px;width:fit-content}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-family:var(--font-mono)}
.hero-meta .sep{color:var(--border-2)}
.map-banner{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border-2);min-height:170px;display:flex;align-items:flex-end;
background:linear-gradient(90deg,rgba(11,12,15,.92) 25%,rgba(11,12,15,.35)),var(--img,none) center/cover,linear-gradient(135deg,var(--c1),var(--c2))}
.map-banner-info{display:flex;flex-direction:column;gap:12px;padding:22px 24px}
.map-title-big{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:44px;font-weight:700;text-transform:uppercase;line-height:1;
text-shadow:0 2px 10px rgba(0,0,0,.7)}
.map-icon{width:56px;height:56px;max-width:none;flex-shrink:0;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:linear-gradient(160deg,#14161b 0%,#0d0e12 100%);
border:1px solid var(--border-2);border-radius:10px;overflow:hidden}
.sb-team{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:22px 26px;min-width:0}
.sb-team.team-a{border-left:3px solid var(--team-a)}
.sb-team.team-b{border-right:3px solid var(--team-b);text-align:right;align-items:flex-end}
.sb-team.team-a.active{background:linear-gradient(90deg,rgba(52,152,219,.14),transparent)}
.sb-team.team-b.active{background:linear-gradient(270deg,rgba(255,122,26,.14),transparent)}
.sb-name{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-a .sb-name{color:var(--team-a)}.team-b .sb-name{color:var(--team-b)}
.sb-turn{width:fit-content;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.5px;padding:2px 7px;border-radius:4px;color:var(--green);
border:1px solid rgba(61,220,132,.35);background:rgba(61,220,132,.08)}
.sb-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 34px;
border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center}
.sb-score{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:58px;font-weight:700;line-height:1}
.sb-score b{color:var(--dim)}.sb-score b.win{color:var(--green)}.sb-score i{font-style:normal;color:var(--border-2);font-size:40px}
.section{padding:48px 0 0}
main.wrap{padding-bottom:64px}
.section-head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.section-head{margin-bottom:18px}
.section-head h2{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:4px}
.summary-list{display:flex;flex-direction:column;gap:8px}
.summary-item{display:grid;grid-template-columns:90px 1fr auto 170px;align-items:center;gap:18px;padding:14px 18px;border-radius:8px;border:1px solid var(--border);
background:linear-gradient(90deg,rgba(18,19,23,.92) 30%,rgba(18,19,23,.6)),var(--img,none) center/cover,var(--panel)}
.summary-item.atual{border-color:rgba(245,197,66,.6);box-shadow:0 0 0 4px rgba(245,197,66,.08)}
.summary-icon{width:34px;height:34px;max-width:none;flex-shrink:0;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.summary-num{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--dim-2)}
.summary-map{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase}
.summary-meta{font-size:13px;color:var(--dim);font-weight:600}
.summary-meta.res-A{color:var(--team-a)}.summary-meta.res-B{color:var(--team-b)}
.summary-side{font-family:var(--font-mono);font-size:11px;text-align:center;padding:5px 10px;border-radius:5px;border:1px solid var(--border-2);color:var(--dim);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-side.ct{color:var(--ct);border-color:rgba(90,169,255,.4)}
.summary-side.knife{color:var(--yellow);border-color:rgba(245,197,66,.4)}
.av{width:32px;height:32px;border-radius:6px;border:1px solid var(--border-2);object-fit:cover;flex-shrink:0;max-width:none}
.av-fb{display:grid;place-items:center;background:var(--panel-2);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--dim)}
.rounds-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.rounds{display:flex;flex-wrap:wrap;gap:5px}
.r{width:34px;height:44px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
background:var(--bg-soft);border:1px solid var(--border);border-top:2px solid;font-family:var(--font-mono);font-size:10px;color:var(--dim)}
.r-A{border-top-color:var(--team-a)}.r-A svg{color:var(--team-a)}
.r-B{border-top-color:var(--team-b)}.r-B svg{color:var(--team-b)}
.r-sep{width:2px;align-self:stretch;background:var(--border-2);margin:0 4px;border-radius:2px}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
font-family:var(--font-mono);font-size:11px;color:var(--dim-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.team-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.team-card.team-A{border-left:3px solid var(--team-a)}.team-card.team-B{border-left:3px solid var(--team-b)}
.team-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
.team-score.win{color:var(--green)}.team-score.loss{color:var(--dim)}
.team-name{font-family:var(--font-display);font-size:22px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-score{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--dim)}
.res{margin-left:auto;font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;padding:4px 9px;border-radius:5px;border:1px solid var(--border-2);color:var(--dim-2)}
.res.win{color:var(--green);border-color:var(--green-2);background:rgba(61,220,132,.08)}
.res.loss{color:var(--red);border-color:rgba(255,70,85,.45);background:rgba(255,70,85,.06)}
.tabela{overflow-x:auto;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 8px;text-align:center;white-space:nowrap;font-size:13.5px}
th{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:1.5px;color:var(--dim-2);background:var(--bg-soft)}
th:first-child,td:first-child{text-align:left;padding-left:18px}
tbody tr{border-top:1px solid var(--border);transition:background .2s}
tbody tr:hover{background:rgba(26,115,232,.05)}
td{font-family:var(--font-mono);font-size:13px}
.player{display:flex;align-items:center;gap:10px;font-family:var(--font-body);font-weight:700;font-size:14px}
.player span{max-width:190px;overflow:hidden;text-overflow:ellipsis}
.player:hover span{color:var(--blue-2)}
.pos{color:var(--green)}.neg{color:var(--red)}
.mvp{color:var(--yellow)}
.rt-cel{display:inline-flex;flex-direction:column;align-items:stretch;gap:4px;width:58px;vertical-align:middle}
.rt-box{display:inline-block;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:13px;line-height:1;padding:5px 7px;border-radius:4px}
.rt-alto{--c:#ffa31a;color:#ffa31a;background:linear-gradient(180deg,rgba(255,163,26,.30),rgba(255,163,26,.10));box-shadow:inset 0 0 0 1px rgba(255,163,26,.6)}
.rt-bom{--c:#5cd65c;color:#6ee86e;background:linear-gradient(180deg,rgba(92,214,92,.28),rgba(92,214,92,.08));box-shadow:inset 0 0 0 1px rgba(92,214,92,.55)}
.rt-medio{--c:#e9e9ee;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rt-baixo{--c:#ff4d4d;color:#ff5c5c;background:linear-gradient(180deg,rgba(255,77,77,.26),rgba(255,77,77,.08));box-shadow:inset 0 0 0 1px rgba(255,77,77,.5)}
.rt-barra{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.rt-barra i{display:block;height:100%;width:var(--w);border-radius:2px;background:var(--c);box-shadow:none}
.rt-mini{width:48px;margin-left:6px}.rt-mini .rt-box{font-size:11.5px;padding:4px 6px}
.rt-g{font-size:22px;padding:7px 12px;border-radius:5px}
.rt-txt{background:none !important;box-shadow:none !important;font-weight:700;font-size:14px}
.col-rt{background:rgba(0,0,0,.28)}
th.col-rt{color:var(--text)}
td.col-rt{white-space:nowrap}
.estrela{color:var(--yellow);font-size:16px;margin-left:8px;vertical-align:middle;text-shadow:0 0 10px rgba(245,197,66,.5)}
.team-A tbody tr{background:rgba(52,152,219,.07)}
.team-B tbody tr{background:rgba(255,122,26,.06)}
.team-A tbody tr:hover{background:rgba(52,152,219,.14)}
.team-B tbody tr:hover{background:rgba(255,122,26,.12)}
.team-meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12.5px;color:var(--dim)}
.team-meta b{color:var(--text);font-weight:700}
.team-meta .sep{width:1px;height:16px;background:var(--border-2)}
.mvp-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}
.mvp-card{position:relative;display:grid;grid-template-columns:200px 1fr auto;gap:26px;align-items:center;padding:22px;border-radius:10px;
background:var(--panel);border:1px solid var(--border);overflow:hidden}
.mvp-card::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--tc,var(--blue))}
.mvp-A{--tc:var(--team-a)}.mvp-B{--tc:var(--team-b)}
.mvp-perfil{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 14px;border-radius:12px;border:1px solid var(--border-2);
background:linear-gradient(180deg,var(--panel-2),var(--bg-soft));text-align:center;min-width:0;box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}
.mvp-perfil b{font-family:var(--font-display);font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvp-av{width:112px;height:112px;border-radius:50%;object-fit:cover;max-width:none;flex-shrink:0;padding:4px;
background:conic-gradient(from 200deg,var(--tc,var(--blue)),#8a5cf6,var(--tc,var(--blue)));box-shadow:0 0 24px -6px var(--tc,var(--blue))}
.mvp-av.av-fb{font-size:30px;padding:0;border:4px solid var(--tc,var(--blue));background:var(--panel-2)}
.mvp-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.mvp-rt{display:flex;align-items:center;gap:12px}
.mvp-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:14px}
.mvp-stats b{display:block;font-family:var(--font-display);font-size:24px;line-height:1.1}
.mvp-stats span{font-size:12.5px;color:var(--dim)}
.mvp-selo{align-self:start;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.mvp-selo span{color:var(--yellow);font-size:28px;text-shadow:0 0 14px rgba(245,197,66,.55)}
.mvp-lista{display:flex;flex-direction:column;gap:8px}
.mvp-item{position:relative;flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--border);min-width:0}
.mvp-item::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:var(--tc,var(--blue))}
.mvp-item .av{width:42px;height:42px;border-radius:50%}
.mvp-item>b{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvp-val{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex-shrink:0}
.mvp-val b{font-family:var(--font-display);font-size:22px;line-height:1.1}
.mvp-val em{font-style:normal;font-size:12px;color:var(--dim)}
.js .revelar.visivel .rt-barra i{animation:barra 1.1s cubic-bezier(.16,.84,.44,1) both;animation-delay:calc(var(--i,0) * 70ms + .35s)}
.js .revelar.visivel .mvp-card,.js .revelar.visivel .mvp-item{animation:subir .55s cubic-bezier(.16,.84,.44,1) both}
.js .revelar.visivel .mvp-item:nth-child(1){animation-delay:.1s}.js .revelar.visivel .mvp-item:nth-child(2){animation-delay:.17s}
.js .revelar.visivel .mvp-item:nth-child(3){animation-delay:.24s}.js .revelar.visivel .mvp-item:nth-child(4){animation-delay:.31s}
.js .revelar.visivel .mvp-av{animation:pop .6s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes barra{from{width:0}}
@media (max-width:980px){.mvp-grid{grid-template-columns:1fr}.mvp-card{grid-template-columns:170px 1fr}.mvp-selo{position:absolute;top:18px;right:18px;font-size:24px}}
@media (max-width:620px){.mvp-card{grid-template-columns:1fr;gap:18px}.mvp-perfil{padding:16px}.mvp-av{width:88px;height:88px}
.mvp-stats b{font-size:20px}.team-meta{margin-left:0;width:100%}.team-head{flex-wrap:wrap}}
.hero-partida{padding:28px 0 34px}
.banner{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border-2);border-bottom:1px solid rgba(255,122,26,.75);padding:18px 24px 30px;
background:linear-gradient(0deg,rgba(255,122,26,.20),transparent 38%),linear-gradient(180deg,rgba(11,12,15,.55),rgba(11,12,15,.82)),
var(--img,none) center 35%/cover,linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 20px 50px -25px rgba(255,122,26,.35)}
.bn-topo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 20px;font-size:13px}
.bn-trilha{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:700;color:var(--text);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.bn-trilha i{font-style:normal;color:var(--dim)}
.bn-tag{padding:3px 9px;border-radius:6px;color:var(--orange);background:rgba(255,122,26,.16);border:1px solid rgba(255,122,26,.45)}
.bn-info{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.bn-info span{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-weight:600}
.bn-mapa{width:24px;height:24px;max-width:none;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.bn-placar{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:24px;margin-top:26px}
.bn-nome{display:flex;flex-direction:column;gap:2px;min-width:0}
.bn-nome-A{align-items:flex-end;text-align:right}
.bn-nome b{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
text-shadow:0 2px 12px rgba(0,0,0,.75)}
.bn-venc{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--green);text-shadow:0 0 12px rgba(61,220,132,.5)}
.bn-logo{position:relative;width:88px;height:88px;flex-shrink:0}
.bn-logo .bn-ini,.bn-logo .bn-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;max-width:none}
.bn-ini,.bn-logo .av-fb{display:grid;place-items:center;background:var(--panel-2);font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--dim)}
.bn-logo::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:4px solid transparent;pointer-events:none}
.bn-logo-A::after{border-right-color:var(--team-a);transform:rotate(-8deg);filter:drop-shadow(0 0 6px var(--team-a))}
.bn-logo-B::after{border-left-color:var(--team-b);transform:rotate(8deg);filter:drop-shadow(0 0 6px var(--team-b))}

.js .revelar{opacity:0}
.js .revelar.visivel{animation:subir .65s cubic-bezier(.16,.84,.44,1) both;animation-delay:var(--d,0s)}

.js .revelar.visivel .summary-item:nth-child(2){animation-delay:.07s}.js .revelar.visivel .summary-item:nth-child(3){animation-delay:.14s}
.js .revelar.visivel .summary-item:nth-child(4){animation-delay:.21s}.js .revelar.visivel .summary-item:nth-child(5){animation-delay:.28s}

@keyframes subir{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.js .revelar{opacity:1}}
.footer{padding:28px 0;border-top:1px solid var(--border);background:var(--bg-soft)}

.section{padding-top:36px}

}.vazio{color:var(--dim);font-size:14px;padding:28px 18px;border:1px dashed var(--border-2);border-radius:10px;text-align:center}

display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}

.filtros i{font-style:normal;font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--dim-2)}
.filtros button.active i{color:var(--blue-2);background:rgba(26,115,232,.15)}

.summary-side.cat-md1{color:var(--green);border-color:rgba(61,220,132,.4)}
.summary-side.cat-md3{color:var(--blue-2);border-color:rgba(52,152,219,.45)}

.serie-bloco{border:1px solid var(--border-2);border-radius:12px;background:var(--bg-soft);padding:12px;display:flex;flex-direction:column;gap:10px}
.serie-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:2px 6px}
.serie-tag{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;padding:3px 8px;border-radius:5px;
color:var(--yellow);border:1px solid rgba(245,197,66,.45);background:rgba(245,197,66,.06)}
.serie-head .mono-label{margin-left:auto}
.serie-mapas{display:flex;flex-direction:column;gap:8px}
.mini-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;max-width:none;flex-shrink:0;border:1px solid var(--border-2);background:var(--panel-2)}
.placar-linha .mini-logo,.serie-placar .mini-logo{opacity:1}
.esqueleto{height:66px;border-radius:8px;border:1px solid var(--border);
background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 40%,#1d1f26 50%,var(--panel-2) 60%,var(--panel) 100%);background-size:250% 100%;
animation:brilho 1.3s ease-in-out infinite}
.esqueleto:nth-child(2){animation-delay:.12s;opacity:.85}.esqueleto:nth-child(3){animation-delay:.24s;opacity:.7}.esqueleto:nth-child(4){animation-delay:.36s;opacity:.55}
.lista.animar>*{animation:subir .5s cubic-bezier(.16,.84,.44,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.lista.animar .serie-mapas .partida{animation:subir .5s cubic-bezier(.16,.84,.44,1) both;animation-delay:calc(var(--i,0) * 55ms + .1s)}
@keyframes brilho{0%{background-position:100% 0}100%{background-position:-150% 0}}
@media (max-width:720px){.titulo{font-size:28px}.partida{grid-template-columns:1fr}.placar-linha{flex-wrap:wrap}
.filtros{width:100%}.filtros button{flex:1;justify-content:center;padding:8px 6px}.serie-head .mono-label{margin-left:0}}</style>
</head>
<body>
<header class="nav"><div class="nav-inner">
<a class="nav-brand" href="/"><img class="mark" src="https://neuraproject.com.br/neurapick/logos/logoNP.ico" alt="logo">
<span>NEURA <span class="outline">PROJECT</span><span class="sub">HISTÓRICO DE PARTIDAS</span></span></a>
<a class="btn btn-ghost btn-sm" href="/">Voltar ao site</a>
</div></header>
<section class="hero"><div class="hero-glow hero-glow-1"></div><div class="hero-glow hero-glow-2"></div>
<div class="wrap hero-inner">
<span class="hero-status"><span class="dot-live"></span><span id="qtd">CARREGANDO…</span></span>
<h1 class="titulo">Partidas do servidor</h1>
<p class="lead">Estatísticas de cada mapa jogado: placar, rounds, K/D, ADR, KAST e rating de todos os jogadores.</p>
</div></section>
<main class="wrap"><section class="section">
<div class="filtros" id="filtros" role="tablist" aria-label="Filtrar partidas">
<button type="button" data-cat="todas" class="active">Todas <i></i></button>
<button type="button" data-cat="md1">MD1 <i></i></button>
<button type="button" data-cat="md3">MD3 <i></i></button>
<button type="button" data-cat="md5">MD5 <i></i></button>
<button type="button" data-cat="normal">Normais <i></i></button>
</div>
<div id="lista" class="lista">
<div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
</div>
<p class="vazio" id="vazio" hidden></p>
<noscript><p class="vazio">Ative o JavaScript para ver a lista de partidas.</p></noscript>
</section></main>
<footer class="footer"><div class="wrap"><div class="footer-legal">
<span>NEURA <b class="t-A">PROJECT</b> · BaseComp</span>
<span>Estatísticas geradas no fim de cada mapa</span>
</div></div></footer>
<script>
const IMG = "https://neuraproject.com.br/neurapick";
const MAPAS = {"ancient":["Ancient","#1f4d3a","#0b1f18"],"anubis":["Anubis","#8a6a2c","#2a1d08"],"cache":["Cache","#5f6f6a","#1a201e"],"dust2":["Dust II","#a67c3d","#3a2710"],"inferno":["Inferno","#8c3b25","#2b0f08"],"mirage":["Mirage","#b0894f","#3b2a14"],"nuke":["Nuke","#2f5f7a","#0b1c26"],"train":["Train","#4d5a63","#15191c"],"overpass":["Overpass","#4f6b3a","#161f10"],"vertigo":["Vertigo","#5d7185","#161d25"]};
const NOMES_CAT = { md1: "MD1", md3: "MD3", md5: "MD5", normal: "Normais" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const idMapa = (m) => (m || "").replace(/^de_/, "");
const dataBr = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(d || ""); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}` : esc(d); };
const caminho = (p) => (p.caminho || p.nome).split("/").map(encodeURIComponent).join("/");
const categoria = (p) => p.categoria || "normal";
const logo = (url) => (url && /^https?:\/\//i.test(url) ? `<img class="mini-logo" src="${esc(url)}" alt="" onerror="this.remove()">` : "");

function card(p, i) {
  const id = idMapa(p.mapa);
  const mapa = MAPAS[id];
  const fundo = mapa ? `--img:url('${IMG}/maps/${id}.jpg');--c1:${mapa[1]};--c2:${mapa[2]}` : "--c1:#2a2f3a;--c2:#0e0f13";
  const icone = mapa ? `<img class="summary-icon" src="${IMG}/maps/icons/${id}.png" alt="">` : "";
  const venc = p.placarA > p.placarB ? "A" : p.placarB > p.placarA ? "B" : "";
  return `<a class="summary-item partida" href="${caminho(p)}/" style="${fundo};--i:${i}">` +
    `<span class="summary-num">${dataBr(p.data)}</span>` +
    `<span class="summary-map">${icone}${esc(mapa ? mapa[0] : id)}</span>` +
    `<span class="placar-linha">${logo(p.logoA)}<span class="t-A${venc === "A" ? " venc" : ""}">${esc(p.timeA)}</span>` +
    `<b>${Number(p.placarA) || 0} : ${Number(p.placarB) || 0}</b>` +
    `<span class="t-B${venc === "B" ? " venc" : ""}">${esc(p.timeB)}</span>${logo(p.logoB)}</span>` +
    `<span class="summary-side cat-${categoria(p)}">${esc(p.serie || "PARTIDA")}</span></a>`;
}

// Mapas da mesma série num bloco só (placar da série = o do mapa mais recente)
function blocos(lista) {
  const saida = [];
  const series = {};
  for (const p of lista) {
    if (!p.serieId) { saida.push({ unico: p }); continue; }
    if (!series[p.serieId]) { series[p.serieId] = { mapas: [] }; saida.push(series[p.serieId]); }
    series[p.serieId].mapas.push(p);
  }
  return saida;
}

function render(lista, cat) {
  const filtrada = cat === "todas" ? lista : lista.filter((p) => categoria(p) === cat);
  let i = 0, html = "";
  for (const b of blocos(filtrada)) {
    if (b.unico) { html += card(b.unico, i++); continue; }
    const ult = b.mapas[0];
    const mapas = [...b.mapas].reverse(); // mapa 1 primeiro
    const vA = ult.serieVitoriasA || 0, vB = ult.serieVitoriasB || 0;
    html += `<div class="serie-bloco" style="--i:${i++}">` +
      `<div class="serie-head"><span class="serie-tag">${esc(NOMES_CAT[categoria(ult)] || "SÉRIE")}</span>` +
      `<span class="serie-placar">${logo(ult.logoA)}<span class="t-A${vA > vB ? " venc" : ""}">${esc(ult.serieTimeA || ult.timeA)}</span>` +
      `<b>${vA} : ${vB}</b><span class="t-B${vB > vA ? " venc" : ""}">${esc(ult.serieTimeB || ult.timeB)}</span>${logo(ult.logoB)}</span>` +
      `<span class="mono-label">${dataBr(mapas[0].data)}</span></div>` +
      `<div class="serie-mapas">${mapas.map((p) => card(p, i++)).join("")}</div></div>`;
  }

  const elLista = document.getElementById("lista");
  elLista.innerHTML = html;
  elLista.classList.remove("animar");
  void elLista.offsetWidth; // reinicia a animação ao trocar de filtro
  elLista.classList.add("animar");

  const vazio = document.getElementById("vazio");
  vazio.hidden = filtrada.length > 0;
  vazio.textContent = lista.length === 0
    ? "Nenhuma partida por enquanto. Assim que um mapa terminar no servidor, ele aparece aqui."
    : `Nenhuma partida ${cat === "normal" ? "normal" : NOMES_CAT[cat] || ""} por enquanto.`;
}

fetch("partidas.json", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : []))
  .catch(() => [])
  .then((lista) => {
    lista = Array.isArray(lista) ? lista : [];
    document.getElementById("qtd").textContent = `${lista.length} PARTIDA${lista.length === 1 ? "" : "S"}`;

    const botoes = document.querySelectorAll("#filtros button");
    botoes.forEach((b) => {
      const cat = b.dataset.cat;
      const n = cat === "todas" ? lista.length : lista.filter((p) => categoria(p) === cat).length;
      b.querySelector("i").textContent = n;
      b.addEventListener("click", () => {
        botoes.forEach((x) => x.classList.toggle("active", x === b));
        history.replaceState(null, "", cat === "todas" ? location.pathname : `#${cat}`);
        render(lista, cat);
      });
    });

    const inicial = (location.hash || "").slice(1);
    const botao = [...botoes].find((b) => b.dataset.cat === inicial);
    if (botao) botao.click(); else render(lista, "todas");
  });
</script>
</body></html>
