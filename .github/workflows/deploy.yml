name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NeuraPick/package-lock.json

      - name: Build NeuraPick
        working-directory: NeuraPick
        run: |
          npm ci
          npm run build

      - name: Montar site
        run: |
          mkdir _site
          cp index.html admin.html CNAME _site/
          cp -r assets _site/
          cp -r NeuraPick/dist _site/neurapick
          # Estatísticas das partidas enviadas pelo plugin BaseComp do servidor de CS2
          if [ -d partidas ]; then cp -r partidas _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
