name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Site inteiro em React (site/): páginas + versão para gerar o HTML no servidor
      - name: Build do site
        working-directory: site
        run: |
          npm ci
          npm run build

      # Junta o build com os dados do repositório (partidas enviadas pelo plugin BaseComp e lista de times),
      # gera o ranking, a página de cada partida e o HTML de todas as páginas já com conteúdo.
      # Cada partida que o plugin envia é um commit, então dispara este deploy.
      # Histórico que estava no ar antes deste deploy (para saber quais partidas são novas e avisar por push)
      - name: Guardar histórico publicado
        run: |
          curl -fsS "https://neuraproject.com.br/partidas/partidas.json?t=$(date +%s)" -o antes.json || echo "null" > antes.json
          # séries anunciadas (primeira vez: ainda não existe no site, conta como lista vazia)
          curl -fsS "https://neuraproject.com.br/partidas/series.json?t=$(date +%s)" -o antes-series.json || echo "[]" > antes-series.json

      - name: Montar site
        run: node site/scripts/gerar-site.mjs --dados . --saida _site

      - name: Preparar avisos de partida
        run: node site/scripts/notificar.mjs preparar antes.json _site/partidas/partidas.json avisos.json antes-series.json _site/partidas/series.json

      - uses: actions/upload-artifact@v4
        with:
          name: avisos
          path: avisos.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Push das partidas novas pelo OneSignal, depois que o site já está no ar (o link da notificação funciona).
  # Chave da API em Settings → Secrets and variables → Actions → ONESIGNAL_API_KEY (sem ela, só pula).
  notificar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: avisos
      - name: Enviar push
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node site/scripts/notificar.mjs enviar avisos.json
