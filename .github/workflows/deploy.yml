name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # O build do React só muda quando o código do site muda. Partida nova (commit do plugin) mexe só em partidas/,
      # então nesse caso o build vem do cache e pula o npm ci e o vite (a parte mais demorada).
      - name: Cache do build
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            site/dist
            site/dist-ssr
          key: build-${{ hashFiles('site/src/**', 'site/public/**', 'site/**/*.html', '!site/dist/**', '!site/node_modules/**', 'site/worker/steam-login/src/**', 'site/package-lock.json', 'site/vite.config.js') }}

      # Site inteiro em React (site/): páginas + versão para gerar o HTML no servidor
      - name: Build do site
        if: steps.build-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      # Junta o build com os dados do repositório (partidas enviadas pelo plugin BaseComp e lista de times),
      # gera o ranking, a página de cada partida e o HTML de todas as páginas já com conteúdo.
      # Cada partida que o plugin envia é um commit, então dispara este deploy.
      - name: Montar site
        run: node site/scripts/gerar-site.mjs --dados . --saida _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
